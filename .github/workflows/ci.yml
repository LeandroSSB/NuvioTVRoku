name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx bslint
      - run: npm run stage
